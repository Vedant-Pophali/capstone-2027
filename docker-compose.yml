services:
  fleet-manager:
    build:
      context: ./fleet-manager
    ports:
      - "8081:8081"
    environment:
      # Override these in production with strong, randomly generated values.
      # The secret must be at least 32 characters for HS256.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET env var must be set. Copy .env.example to .env and fill in values.}
      - JWT_EXPIRATION_SECONDS=${JWT_EXPIRATION_SECONDS:-86400}
    volumes:
      # Mount Docker socket so Spring Boot can spin up containers dynamically
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist the SQLite DB to the host
      - ./data/fleet-manager:/app/data
    restart: unless-stopped

  dashboard-client:
    build:
      context: ./vsoc-dashboard/client
    ports:
      - "5173:80"
    depends_on:
      - fleet-manager
    restart: unless-stopped

  # The edge-vehicle is built here so the image is available locally.
  # The fleet-manager dynamically spins up instances of this image via Docker CLI.
  edge-vehicle-base:
    build:
      context: ./edge-vehicles
    environment:
      - VEHICLE_ID=1
    restart: unless-stopped
    profiles: ["disabled"]
