spring.application.name=fleet-manager
server.port=8081

# --- Database (SQLite via JPA) ---
spring.datasource.url=jdbc:sqlite:/app/data/fleet.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# --- Jackson (JSON serialization) ---
spring.jackson.serialization.write-dates-as-timestamps=false

# --- JWT Authentication ---
# Secret key for HS256 signing. Must be at least 32 characters (256 bits).
# Set JWT_SECRET as an environment variable — no hardcoded fallback to prevent accidental weak-key usage.
jwt.secret=${JWT_SECRET}
# Token lifetime in seconds: 86400 = 24 hours
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# --- Default Seed User ---
# Set DEFAULT_ADMIN_USERNAME and DEFAULT_ADMIN_PASSWORD as environment variables.
# No hardcoded password fallback — the app will fail fast if DEFAULT_ADMIN_PASSWORD is unset.
app.default-user.username=${DEFAULT_ADMIN_USERNAME:admin}
app.default-user.password=${DEFAULT_ADMIN_PASSWORD}
app.default-user.role=${DEFAULT_ADMIN_ROLE:ADMIN}

